<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JardiTips.Client</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="JardiTips.Client.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="plant-loader" role="status" aria-live="polite" aria-label="Jardi Tips is loading">
            <img class="plant-loader-animation" src="images/loading-plant.svg" alt="" />
            <div class="plant-loader-title">Grow your expertise</div>
            <div class="plant-loader-progress"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        window.addEventListener('load', async () => {
            if (!('serviceWorker' in navigator)) {
                return;
            }

            try {
                await navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
            } catch (error) {
                console.error('Service worker registration failed:', error);
            }
        });
    </script>
</body>

</html>
